<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebDev Hub - Sign in</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Main Body -->
    <div class="main">

        <!-- Website Heading -->
        <h1>WebDev Hub.</h1>

        <p id="para-head">Learn . Build . Grow</p>

        <!-- Welcome Section -->
        <h2>Welcome to WebDev Hub!</h2>

        <p id="paragragh">
           Join WebDev Hub and start learning
            <br>
            web development today.
        </p>

        <!-- Login Form -->
        <div class="input">

            <!--Full name-->
            <input type="text" placeholder="Full Name">

            <br>

            <!-- Email or Username -->
            <input type="text" placeholder="Email or User Name">

            <br>

            <!-- Password -->
            <input type="password" placeholder="Password">

            <br>

            <!--Confrim Password-->
            <input type="password" placeholder="Confrim Password">

            <br>

            <!-- Sign up -->
            <a href="index.html" id="aone"><button id="aone">Sign Up -&gt;</button></a>

            <!-- OR Section -->
            <p>or</p>

            <!-- Social Login Buttons -->
            <div class="buttons">

                <!-- Google Button -->
                <a href="https://accounts.google.com/">
                    <button type="button">
                        Continue with Google
                    </button>
                </a>

                <!-- GitHub Button -->
                <a href="https://github.com/login">
                    <button type="button">
                        Continue with GitHub
                    </button>
                </a>

            </div>

        </div>

        <!-- Log In Section -->
        <p id="one">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</body>

</html>
