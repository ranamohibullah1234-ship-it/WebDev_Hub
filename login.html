<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebDev Hub - Login</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Main Body -->
    <div class="main">

        <!-- Website Heading -->
        <h1>WebDev Hub.</h1>

        <p id="para-head">Learn . Build . Grow</p>

        <!-- Welcome Section -->
        <h2>Welcome to WebDev Hub!</h2>

        <p id="paragragh">
            Login to your account and continue
            <br>
            your web development journey.
        </p>

        <!-- Login Form -->
        <div class="input">

            <!-- Email or Username -->
            <input type="text" placeholder="Email or User Name">

            <br>

            <!-- Password -->
            <input type="password" placeholder="Password">

            <br>

            <!-- Forgot Password -->
            <a href="#">Forgot Password?</a>

            <br>

            <!-- Login Button -->
            <button type="button">Login -&gt;</button>

            <!-- OR Section -->
            <p>or</p>

            <!-- Social Login Buttons -->
            <div class="buttons">

                <!-- Google Button -->
                <a href="https://accounts.google.com/">
                    <button type="button">
                        Continue with Google
                    </button>
                </a>

                <!-- GitHub Button -->
                <a href="https://github.com/login">
                    <button type="button">
                        Continue with GitHub
                    </button>
                </a>

            </div>

        </div>

        <!-- Sign In Section -->
        <p id="one">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>

    </div>

</body>

</html>
